name: Vaultwarden Version Check

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:

concurrency:
  group: vaultwarden-termux-build
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check latest release
        id: check
        run: |
          VERSION=$(curl -fsSL \
            https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest \
            | jq -r '.tag_name')
      
          echo "Latest version: $VERSION"
      
          OLD_VERSION=$(cat .upstream-version 2>/dev/null || echo "")
      
          if [ "$VERSION" != "$OLD_VERSION" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      
      - name: Trigger build
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        run: |
          gh workflow run build.yml \
            --ref main \
            -f tag="${{ steps.check.outputs.version }}"
